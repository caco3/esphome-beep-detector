number:
  - platform: template
    name: "Beep volume threshold"
    id: beep_volume_threshold
    optimistic: true
    restore_value: true
    initial_value: ${beep_volume_threshold}
    min_value: 0
    max_value: 1
    step: 0.001
    on_value:
      - lambda: 'id(g_beep_volume_threshold) = x;'

  - platform: template
    name: "Freezer frequency threshold"
    id: freezer_freq_threshold
    optimistic: true
    restore_value: true
    initial_value: ${freezer_freq_threshold}
    min_value: 0
    max_value: 10000
    step: 10
    unit_of_measurement: "Hz"
    on_value:
      - lambda: 'id(g_freezer_freq_threshold) = x;'

  - platform: template
    name: "Freezer on min duration"
    id: freezer_on_min
    optimistic: true
    restore_value: false
    initial_value: ${freezer_on_min}
    min_value: 0
    max_value: 5000
    step: 10
    unit_of_measurement: "ms"
    on_value:
      - lambda: 'id(g_freezer_on_min) = x;'

  - platform: template
    name: "Freezer on max duration"
    id: freezer_on_max
    optimistic: true
    restore_value: false
    initial_value: ${freezer_on_max}
    min_value: 0
    max_value: 10000
    step: 10
    unit_of_measurement: "ms"
    on_value:
      - lambda: 'id(g_freezer_on_max) = x;'

  - platform: template
    name: "Freezer off min duration"
    id: freezer_off_min
    optimistic: true
    restore_value: false
    initial_value: ${freezer_off_min}
    min_value: 0
    max_value: 5000
    step: 10
    unit_of_measurement: "ms"
    on_value:
      - lambda: 'id(g_freezer_off_min) = x;'

  - platform: template
    name: "Freezer off max duration"
    id: freezer_off_max
    optimistic: true
    restore_value: false
    initial_value: ${freezer_off_max}
    min_value: 0
    max_value: 10000
    step: 10
    unit_of_measurement: "ms"
    on_value:
      - lambda: 'id(g_freezer_off_max) = x;'

  - platform: template
    name: "USV Alarm min frequency"
    id: usv_freq_min
    optimistic: true
    restore_value: true
    initial_value: ${usv_freq_min}
    min_value: 0
    max_value: 10000
    step: 10
    unit_of_measurement: "Hz"
    on_value:
      - lambda: 'id(g_usv_freq_min) = x;'

  - platform: template
    name: "USV Alarm max frequency"
    id: usv_freq_max
    optimistic: true
    restore_value: true
    initial_value: ${usv_freq_max}
    min_value: 0
    max_value: 10000
    step: 10
    unit_of_measurement: "Hz"
    on_value:
      - lambda: 'id(g_usv_freq_max) = x;'

  - platform: template
    name: "Beep min duration"
    id: beep_min_duration
    optimistic: true
    restore_value: true
    initial_value: ${beep_min_duration}
    min_value: 0
    max_value: 5000
    step: 5
    unit_of_measurement: "ms"
    on_value:
      - lambda: 'id(g_beep_min_duration) = x;'

  - platform: template
    name: "Frequency filter alpha"
    id: frequency_filter_alpha
    optimistic: true
    restore_value: true
    initial_value: ${frequency_filter_alpha}
    min_value: 0
    max_value: 1
    step: 0.001
    on_value:
      - lambda: 'id(g_frequency_filter_alpha) = x;'

  - platform: template
    name: "Noise gate floor"
    id: noise_gate_floor_num
    optimistic: true
    restore_value: true
    initial_value: ${noise_gate_floor_num}
    min_value: 0.0001
    max_value: 0.1
    step: 0.0001
    on_value:
      - lambda: 'id(g_noise_gate_floor_num) = x; id(sound_engine).set_noise_gate_floor(x);'

  - platform: template
    name: "Pre-amp gain"
    id: pre_amp_gain_num
    optimistic: true
    restore_value: true
    initial_value: ${pre_amp_gain_num}
    min_value: 0.1
    max_value: 20.0
    step: 0.1
    on_value:
      - lambda: 'id(g_pre_amp_gain_num) = x; id(sound_engine).set_pre_amp_gain(x);'

  - platform: template
    name: "USV target frequency"
    id: usv_target_frequency
    optimistic: true
    restore_value: true
    initial_value: ${usv_target_frequency}
    min_value: 0
    max_value: 10000
    step: 10
    unit_of_measurement: "Hz"
    on_value:
      - lambda: 'id(g_usv_target_frequency) = x; id(sound_engine).set_usv_target_freq(x);'

  - platform: template
    name: "USV target width"
    id: usv_target_width
    optimistic: true
    restore_value: true
    initial_value: ${usv_target_width}
    min_value: 1
    max_value: 1000
    step: 10
    unit_of_measurement: "Hz"
    on_value:
      - lambda: 'id(g_usv_target_width) = x; id(sound_engine).set_usv_target_width(x);'

  - platform: template
    name: "USV guard width"
    id: usv_guard_width
    optimistic: true
    restore_value: true
    initial_value: ${usv_guard_width}
    min_value: 1
    max_value: 2000
    step: 10
    unit_of_measurement: "Hz"
    on_value:
      - lambda: 'id(g_usv_guard_width) = x; id(sound_engine).set_usv_guard_width(x);'

  - platform: template
    name: "USV beep threshold"
    id: usv_beep_threshold
    optimistic: true
    restore_value: true
    initial_value: ${usv_beep_threshold}
    min_value: 0
    max_value: 1000
    step: 0.1
    on_value:
      - lambda: 'id(g_usv_beep_threshold) = x;'

  - platform: template
    name: "Freezer target frequency"
    id: freezer_target_frequency
    optimistic: true
    restore_value: true
    initial_value: ${freezer_target_frequency}
    min_value: 0
    max_value: 10000
    step: 10
    unit_of_measurement: "Hz"
    on_value:
      - lambda: 'id(g_freezer_target_frequency) = x; id(sound_engine).set_freezer_target_freq(x);'

  - platform: template
    name: "Freezer target width"
    id: freezer_target_width
    optimistic: true
    restore_value: true
    initial_value: ${freezer_target_width}
    min_value: 1
    max_value: 1000
    step: 10
    unit_of_measurement: "Hz"
    on_value:
      - lambda: 'id(g_freezer_target_width) = x; id(sound_engine).set_freezer_target_width(x);'

  - platform: template
    name: "Freezer guard width"
    id: freezer_guard_width
    optimistic: true
    restore_value: true
    initial_value: ${freezer_guard_width}
    min_value: 1
    max_value: 2000
    step: 10
    unit_of_measurement: "Hz"
    on_value:
      - lambda: 'id(g_freezer_guard_width) = x; id(sound_engine).set_freezer_guard_width(x);'

  - platform: template
    name: "Freezer beep threshold"
    id: freezer_beep_threshold
    optimistic: true
    restore_value: true
    initial_value: ${freezer_beep_threshold}
    min_value: 0
    max_value: 1000
    step: 0.1
    on_value:
      - lambda: 'id(g_freezer_beep_threshold) = x;'
